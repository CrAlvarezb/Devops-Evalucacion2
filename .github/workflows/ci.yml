name: Pipeline CI-CD Evaluacion 2

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pruebas-y-seguridad:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Pruebas Unitarias Backend (IE2)
        run: |
          cd backend
          npm install
          npm test

      - name: Validacion Sintactica Frontend (IE2)
        run: node --check frontend/app.js

      - name: Escaneo de Seguridad y Bloqueo (IE3)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"

  despliegue-simulado:
    needs: pruebas-y-seguridad
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Construir y Desplegar con Docker Compose (IE4 e IE5)
        run: |
          docker compose build
          docker compose up -d
          docker compose ps
