name: EP2 CI/CD

on:
  push:
    branches: [main, develop, "feature/ep2-auditoria-cicd"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
        working-directory: backend
      - name: Pruebas unitarias y de API
        run: npm test
        working-directory: backend
      - name: Sintaxis del frontend
        run: node --check frontend/app.js

  seguridad:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Node.js para analizar JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias para el análisis
        run: npm ci
        working-directory: backend
      - name: Verificar versión de Node.js del analizador
        run: |
          node --version
          node -e "const v = process.versions.node.split('.').map(Number); if (v[0] !== 22 || v[1] < 11) process.exit(1)"
      - name: Verificar configuración de SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_TOKEN" || { echo "::error::Falta el secret SONAR_TOKEN"; exit 1; }
      - name: Análisis de código y Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        with:
          args: >
            -Dsonar.scanner.skipNodeProvisioning=true
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: Escaneo de dependencias y configuración con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          skip-dirs: k8s,tools
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

  construccion:
    needs: seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar credenciales efímeras para validar Compose
        run: |
          echo "DB_ROOT_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "DB_APP_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "APP_VERSION=$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Validar Compose y construir imágenes
        run: |
          docker compose config --quiet
          docker compose build
          docker image inspect "tienda-backend:$GITHUB_SHA" "tienda-frontend:$GITHUB_SHA"

  despliegue-simulado:
    needs: construccion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar credenciales efímeras para el despliegue
        run: |
          echo "DB_ROOT_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "DB_APP_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "APP_VERSION=$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Construir y desplegar con Docker Compose
        run: |
          docker compose up -d --build --wait --wait-timeout 180
          docker compose ps
          curl --fail --silent --show-error --retry 8 --retry-delay 3 http://127.0.0.1:8080/api/health
          curl --fail --silent --show-error http://127.0.0.1:8080/api/productos
      - name: Evidencia y limpieza del runner
        if: always()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=80 || true
          docker compose down -v || true
